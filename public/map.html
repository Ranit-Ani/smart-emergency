<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Map View – Smart Emergency</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23E63946'/><text x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' fill='white' font-size='20'>🚑</text></svg>"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="css/style.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    #mainMap { height: 520px; width: 100%; border-radius: 14px; border: 1px solid var(--border); }
    .leaflet-popup-content-wrapper {
      background: #182534 !important;
      border: 1px solid rgba(255,255,255,0.07) !important;
      color: #f0f4f8 !important;
      border-radius: 10px !important;
    }
    .leaflet-popup-tip { background: #182534 !important; }
    .leaflet-popup-content { color: #f0f4f8 !important; font-family: 'Barlow', sans-serif; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" href="index.html"><div class="brand-icon">🚑</div>Smart Emergency</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span style="color:white;font-size:1.3rem">☰</span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto gap-1">
        <li class="nav-item"><a class="nav-link" href="index.html">🏠 Home</a></li>
        <li class="nav-item"><a class="nav-link" href="symptoms.html">🩺 Symptoms</a></li>
        <li class="nav-item"><a class="nav-link" href="hospitals.html">🏥 Hospitals</a></li>
        <li class="nav-item"><a class="nav-link active" href="map.html">🗺️ Map</a></li>
        <li class="nav-item"><a class="nav-link" href="emergency-contacts.html">📞 Emergency</a></li>
      </ul>
    </div>
  </div>
</nav>

<section class="hero-section" style="padding:2rem 0 1.5rem;">
  <div class="container">
    <h1 class="section-title">Hospital <span class="title-accent">Map View</span></h1>
    <p class="section-sub">All hospitals plotted on map — click a marker for details</p>
    <button onclick="locateUser()" class="btn-emergency" style="font-size:0.9rem;padding:10px 22px;">
      📍 Show My Location
    </button>
  </div>
</section>

<section style="padding:1rem 0 4rem;">
  <div class="container">
    <div class="row g-4">
      <div class="col-lg-8">
        <div id="mainMap"></div>
      </div>
      <div class="col-lg-4">
        <div style="font-family:var(--font-display);font-size:1rem;font-weight:600;margin-bottom:1rem;">🏥 Hospital List</div>
        <div id="mapHospitalList" style="max-height:490px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;">
        </div>
      </div>
    </div>
    <div style="margin-top:1.5rem;display:flex;gap:1.5rem;flex-wrap:wrap;">
      <div style="display:flex;align-items:center;gap:8px;color:var(--gray);font-size:0.85rem;">
        <div style="width:12px;height:12px;background:#06d6a0;border-radius:50%;"></div> Emergency Available
      </div>
      <div style="display:flex;align-items:center;gap:8px;color:var(--gray);font-size:0.85rem;">
        <div style="width:12px;height:12px;background:#ffd166;border-radius:50%;"></div> Busy / Limited
      </div>
      <div style="display:flex;align-items:center;gap:8px;color:var(--gray);font-size:0.85rem;">
        <div style="width:12px;height:12px;background:#E63946;border-radius:50%;"></div> Your Location
      </div>
    </div>
  </div>
</section>

<footer>
  <div class="container text-center">
    <p style="color:var(--gray);font-size:0.88rem;">&copy; 2025 Smart Emergency &nbsp;|&nbsp; <a href="tel:108" style="color:var(--red);">🚑 108 Ambulance</a></p>
  </div>
</footer>

<div class="toast-container" id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/main.js"></script>
<script src="js/map.js"></script>
</body>
</html>
