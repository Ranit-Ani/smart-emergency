<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login – Smart Emergency</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="admin.css" rel="stylesheet"/>
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--navy); }
    .login-card { background:var(--navy-card); border:1px solid var(--border); border-radius:16px; padding:2.5rem; width:100%; max-width:400px; }
  </style>
</head>
<body>
<div class="login-card">
  <div style="text-align:center;margin-bottom:2rem;">
    <div style="font-size:2.5rem;margin-bottom:0.75rem;">🚑</div>
    <div style="font-family:var(--font-display);font-size:1.6rem;font-weight:700;">Smart Emergency</div>
    <div style="color:var(--gray);font-size:0.88rem;margin-top:4px;">Admin Panel</div>
  </div>

  <div id="errorMsg" style="background:rgba(230,57,70,0.1);border:1px solid rgba(230,57,70,0.3);color:var(--red);padding:10px 14px;border-radius:8px;font-size:0.88rem;margin-bottom:1rem;display:none;"></div>

  <div class="form-group">
    <label class="form-label">Email</label>
    <input type="email" id="email" class="form-input" placeholder="admin@smartemergency.com" value="admin@smartemergency.com"/>
  </div>
  <div class="form-group">
    <label class="form-label">Password</label>
    <input type="password" id="password" class="form-input" placeholder="••••••••" value="Admin@123"/>
  </div>

  <button onclick="doLogin()" id="loginBtn" class="btn-primary w-100" style="width:100%;margin-top:0.5rem;padding:12px;">
    Login to Admin Panel
  </button>

  <div style="margin-top:1.5rem;text-align:center;">
    <a href="/" style="color:var(--gray);font-size:0.85rem;text-decoration:none;">← Back to Smart Emergency</a>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
  // If already logged in
  if (localStorage.getItem('adminToken')) window.location.href = '/admin/dashboard.html';

  async function doLogin() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('loginBtn');
    const errMsg = document.getElementById('errorMsg');

    if (!email || !password) { showError('Please enter email and password'); return; }

    btn.disabled = true;
    btn.textContent = 'Logging in...';
    errMsg.style.display = 'none';

    try {
      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (data.success) {
        localStorage.setItem('adminToken', data.token);
        localStorage.setItem('adminEmail', data.email);
        window.location.href = '/admin/dashboard.html';
      } else {
        showError(data.error || 'Login failed');
      }
    } catch (err) {
      showError('Server error. Please try again.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Login to Admin Panel';
    }
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.style.display = 'block';
  }

  document.addEventListener('keypress', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
