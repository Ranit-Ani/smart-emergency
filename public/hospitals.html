<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nearby Hospitals – Smart Emergency</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23E63946'/><text x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' fill='white' font-size='20'>🚑</text></svg>"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="css/style.css" rel="stylesheet"/>
</head>
<body>

<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" href="index.html"><div class="brand-icon">🚑</div>Smart Emergency</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span style="color:white;font-size:1.3rem">☰</span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto gap-1">
        <li class="nav-item"><a class="nav-link" href="index.html">🏠 Home</a></li>
        <li class="nav-item"><a class="nav-link" href="symptoms.html">🩺 Symptoms</a></li>
        <li class="nav-item"><a class="nav-link active" href="hospitals.html">🏥 Hospitals</a></li>
        <li class="nav-item"><a class="nav-link" href="map.html">🗺️ Map</a></li>
        <li class="nav-item"><a class="nav-link" href="emergency-contacts.html">📞 Emergency</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="loading-overlay" id="loadingOverlay" style="display:none;">
  <div class="spinner-ring"></div>
  <p style="color:var(--gray);margin-top:16px;">Searching hospitals...</p>
</div>

<section class="hero-section" style="padding:2rem 0 1.5rem;">
  <div class="container">
    <h1 class="section-title">Nearby <span class="title-accent">Hospitals</span></h1>
    <p class="section-sub" id="searchSummary">Showing all hospitals · Use filters to narrow results</p>

    <!-- Filters -->
    <div class="row g-3 align-items-end">
      <div class="col-md-3">
        <label class="form-label-emergency">Department</label>
        <select id="deptFilter" class="form-control-emergency" onchange="applyFilters()">
          <option value="">All Departments</option>
          <option value="Cardiology">Cardiology</option>
          <option value="Neurology">Neurology</option>
          <option value="Trauma Center">Trauma Center</option>
          <option value="Gynecology">Gynecology</option>
          <option value="General Medicine">General Medicine</option>
          <option value="Emergency Medicine">Emergency Medicine</option>
        </select>
      </div>
      <div class="col-md-2">
        <label class="form-label-emergency">Radius (km)</label>
        <select id="radiusFilter" class="form-control-emergency" onchange="applyFilters()">
          <option value="5">5 km</option>
          <option value="10">10 km</option>
          <option value="20" selected>20 km</option>
          <option value="50">50 km</option>
        </select>
      </div>
      <div class="col-md-2">
        <label class="form-label-emergency">Status</label>
        <select id="statusFilter" class="form-control-emergency" onchange="applyFilters()">
          <option value="">All</option>
          <option value="available">Available</option>
          <option value="busy">Busy</option>
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label-emergency">Search</label>
        <input type="text" id="searchInput" class="form-control-emergency" placeholder="Hospital name..." oninput="applyFilters()"/>
      </div>
      <div class="col-md-2">
        <button onclick="detectAndSearch()" class="btn-emergency w-100" style="padding:12px;">
          📍 Near Me
        </button>
      </div>
    </div>
  </div>
</section>

<section style="padding:2rem 0 4rem;">
  <div class="container">
    <div id="resultCount" style="color:var(--gray);font-size:0.88rem;margin-bottom:1.25rem;"></div>
    <div class="row g-3" id="hospitalsList">
      <!-- Hospitals rendered here -->
    </div>
    <div id="emptyState" style="display:none;text-align:center;padding:4rem 0;">
      <div style="font-size:3rem;margin-bottom:1rem;">🏥</div>
      <div style="font-family:var(--font-display);font-size:1.3rem;font-weight:600;margin-bottom:0.5rem;">No hospitals found</div>
      <div style="color:var(--gray);">Try expanding the radius or changing filters</div>
    </div>
  </div>
</section>

<footer>
  <div class="container text-center">
    <p style="color:var(--gray);font-size:0.88rem;">&copy; 2025 Smart Emergency &nbsp;|&nbsp; <a href="tel:108" style="color:var(--red);">🚑 108 Ambulance</a></p>
  </div>
</footer>

<div class="toast-container" id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
<script src="js/hospitals.js"></script>
</body>
</html>
